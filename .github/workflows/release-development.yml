name: Development Release

on:
  push:
    branches: [develop]

permissions:
  contents: write

concurrency:
  group: activity-tracker-development-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: version
        run: echo "value=$(jq -r '.version' custom_components/activity_tracker/manifest.json)-dev" >> "$GITHUB_OUTPUT"
      - run: git tag -f "v${{ steps.version.outputs.value }}" && git push origin -f "v${{ steps.version.outputs.value }}"
