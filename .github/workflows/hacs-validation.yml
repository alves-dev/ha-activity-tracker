name: HACS Validation

on:
  push:
    branches: [develop]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main reviewed 2026-08-26
        with:
          category: integration
